<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Insurance Wizard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    
    .slide-left-enter {
      opacity: 0;
      transform: translateX(40px);
    }
    .slide-left-enter-active {
      opacity: 1;
      transform: translateX(0);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .slide-left-leave {
      opacity: 1;
      transform: translateX(0);
    }
    .slide-left-leave-active {
      opacity: 0;
      transform: translateX(-40px);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ============================================
    // STEP ORIGIN
    // ============================================
    function StepOrigin({ data, onUpdate, onNext }) {
      const [search, setSearch] = useState('');
      
      const countries = [
        { code: 'CO', name: 'Colombia', flag: '🇨🇴' },
        { code: 'MX', name: 'México', flag: '🇲🇽' },
        { code: 'AR', name: 'Argentina', flag: '🇦🇷' },
        { code: 'CL', name: 'Chile', flag: '🇨🇱' },
        { code: 'PE', name: 'Perú', flag: '🇵🇪' },
        { code: 'EC', name: 'Ecuador', flag: '🇪🇨' },
        { code: 'US', name: 'Estados Unidos', flag: '🇺🇸' },
        { code: 'ES', name: 'España', flag: '🇪🇸' },
        { code: 'BR', name: 'Brasil', flag: '🇧🇷' },
        { code: 'UY', name: 'Uruguay', flag: '🇺🇾' },
        { code: 'VE', name: 'Venezuela', flag: '🇻🇪' },
        { code: 'CA', name: 'Canadá', flag: '🇨🇦' },
      ];

      const filtered = search.trim() 
        ? countries.filter(c => c.name.toLowerCase().includes(search.toLowerCase()))
        : countries;

      const handleSelect = (code) => {
        onUpdate({ origin: code });
        onNext();
      };

      return (
        <div className="space-y-6">
          <div className="text-center mb-8">
            <h2 className="text-2xl font-semibold text-gray-900 mb-2">
              ¿Desde dónde viajas?
            </h2>
            <p className="text-gray-500 text-sm">Selecciona tu país de origen</p>
          </div>

          <div className="relative">
            <svg className="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input
              type="text"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Buscar país..."
              className="w-full h-14 pl-12 pr-4 text-lg bg-white border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-500/10 transition-all"
            />
          </div>

          <div className="grid grid-cols-2 gap-3">
            {filtered.map((country) => (
              <button
                key={country.code}
                onClick={() => handleSelect(country.code)}
                className="flex items-center gap-3 p-4 rounded-xl border-2 border-gray-100 bg-white hover:border-blue-500 hover:bg-blue-500 hover:text-white group transition-all duration-200 text-left"
              >
                <span className="text-2xl">{country.flag}</span>
                <span className="font-medium text-gray-700 group-hover:text-white">
                  {country.name}
                </span>
              </button>
            ))}
          </div>

          {filtered.length === 0 && (
            <p className="text-center text-gray-500 py-8">
              No encontramos "{search}"
            </p>
          )}
        </div>
      );
    }

    // ============================================
    // STEP DATES
    // ============================================
    function StepDates({ data, onUpdate, onNext }) {
      const [startDate, setStartDate] = useState(data.startDate || '');
      const [endDate, setEndDate] = useState(data.endDate || '');
      const today = new Date().toISOString().split('T')[0];

      const isValid = startDate && endDate && startDate <= endDate;

      const handleContinue = () => {
        if (isValid) {
          onUpdate({ startDate, endDate });
          onNext();
        }
      };

      return (
        <div className="space-y-8">
          <div className="text-center mb-8">
            <h2 className="text-2xl font-semibold text-gray-900 mb-2">
              ¿Cuándo es tu aventura?
            </h2>
            <p className="text-gray-500 text-sm">Elige las fechas de tu viaje</p>
          </div>

          <div className="space-y-4">
            <div>
              <label className="block text-sm font-medium text-gray-600 mb-2">
                Fecha de ida
              </label>
              <input
                type="date"
                value={startDate}
                min={today}
                onChange={(e) => setStartDate(e.target.value)}
                className="w-full h-14 px-4 text-lg bg-white border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-500/10 transition-all"
              />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-600 mb-2">
                Fecha de regreso
              </label>
              <input
                type="date"
                value={endDate}
                min={startDate || today}
                onChange={(e) => setEndDate(e.target.value)}
                className="w-full h-14 px-4 text-lg bg-white border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-500/10 transition-all"
              />
            </div>
          </div>

          <button
            onClick={handleContinue}
            disabled={!isValid}
            className="w-full h-14 bg-yellow-400 text-gray-900 font-semibold text-lg rounded-xl hover:bg-yellow-500 disabled:bg-gray-200 disabled:text-gray-400 transition-all duration-200 shadow-lg"
          >
            Continuar
          </button>
        </div>
      );
    }

    // ============================================
    // STEP TRAVELERS
    // ============================================
    function StepTravelers({ data, onUpdate, onNext }) {
      const options = [
        { id: 'solo', label: 'Solo', sublabel: '1 persona', icon: '🧑', price: 'Desde $25' },
        { id: 'pareja', label: 'Pareja', sublabel: '2 personas', icon: '👫', price: 'Desde $40' },
        { id: 'familia', label: 'Familia', sublabel: '3-5 personas', icon: '👨‍👩‍👧‍👦', price: 'Desde $55' },
        { id: 'grupo', label: 'Grupo', sublabel: '6+ personas', icon: '👥', price: 'Desde $70' },
      ];

      const handleSelect = (option) => {
        onUpdate({ travelers: option.id });
        onNext();
      };

      return (
        <div className="space-y-6">
          <div className="text-center mb-8">
            <h2 className="text-2xl font-semibold text-gray-900 mb-2">
              ¿Quiénes van en este viaje?
            </h2>
            <p className="text-gray-500 text-sm">Cuéntanos quiénes viajan</p>
          </div>

          <div className="grid grid-cols-2 gap-4">
            {options.map((option) => (
              <button
                key={option.id}
                onClick={() => handleSelect(option)}
                className="relative p-6 rounded-2xl border-2 border-gray-100 bg-white hover:border-blue-500 hover:bg-blue-500 group transition-all duration-200 text-center"
              >
                <span className="text-5xl mb-3 block">{option.icon}</span>
                <h3 className="font-semibold text-lg text-gray-800 group-hover:text-white mb-1">
                  {option.label}
                </h3>
                <p className="text-sm text-gray-500 group-hover:text-white/80 mb-3">
                  {option.sublabel}
                </p>
                <span className="text-sm font-medium text-blue-600 group-hover:text-white/90">
                  {option.price}
                </span>
              </button>
            ))}
          </div>
        </div>
      );
    }

    // ============================================
    // STEP BIRTHDATE
    // ============================================
    function StepBirthdate({ data, onUpdate, onNext }) {
      const [day, setDay] = useState(data.day || '');
      const [month, setMonth] = useState(data.month || '');
      const [year, setYear] = useState(data.year || '');

      const isValid = () => {
        const d = parseInt(day);
        const m = parseInt(month);
        const y = parseInt(year);
        return d >= 1 && d <= 31 && m >= 1 && m <= 12 && y >= 1900 && y <= new Date().getFullYear() - 18;
      };

      const handleContinue = () => {
        if (isValid()) {
          onUpdate({ day, month, year });
          onNext();
        }
      };

      return (
        <div className="space-y-8">
          <div className="text-center mb-8">
            <h2 className="text-2xl font-semibold text-gray-900 mb-2">
              ¿Cuándo naciste?
            </h2>
            <p className="text-gray-500 text-sm">Necesitamos tu fecha de nacimiento</p>
          </div>

          <div className="flex gap-4">
            <div className="flex-1">
              <label className="block text-sm font-medium text-gray-600 mb-2">Día</label>
              <input
                type="text"
                inputMode="numeric"
                maxLength={2}
                value={day}
                onChange={(e) => setDay(e.target.value)}
                placeholder="DD"
                className="w-full h-14 px-4 text-lg text-center bg-white border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-500/10 transition-all"
              />
            </div>
            <div className="flex-1">
              <label className="block text-sm font-medium text-gray-600 mb-2">Mes</label>
              <input
                type="text"
                inputMode="numeric"
                maxLength={2}
                value={month}
                onChange={(e) => setMonth(e.target.value)}
                placeholder="MM"
                className="w-full h-14 px-4 text-lg text-center bg-white border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-500/10 transition-all"
              />
            </div>
            <div className="flex-1">
              <label className="block text-sm font-medium text-gray-600 mb-2">Año</label>
              <input
                type="text"
                inputMode="numeric"
                maxLength={4}
                value={year}
                onChange={(e) => setYear(e.target.value)}
                placeholder="AAAA"
                className="w-full h-14 px-4 text-lg text-center bg-white border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-500/10 transition-all"
              />
            </div>
          </div>

          <button
            onClick={handleContinue}
            disabled={!isValid()}
            className="w-full h-14 bg-yellow-400 text-gray-900 font-semibold text-lg rounded-xl hover:bg-yellow-500 disabled:bg-gray-200 disabled:text-gray-400 transition-all duration-200 shadow-lg"
          >
            Continuar
          </button>
        </div>
      );
    }

    // ============================================
    // STEP PLANS
    // ============================================
    function StepPlans({ data, onUpdate, onNext }) {
      const [selectedPlan, setSelectedPlan] = useState(data.selectedPlan || null);

      const plans = [
        {
          id: 'essential',
          name: 'Essential',
          price: 25,
          coverage: '$15,000 USD',
          features: ['Emergencias médicas', 'Repatriación básica', 'Teleconsulta 24/7', 'COVID-19'],
          popular: false,
        },
        {
          id: 'explorer',
          name: 'Explorer',
          price: 40,
          coverage: '$50,000 USD',
          features: ['Todo de Essential', 'Cancelación de viaje', 'Equipaje protegido', 'COVID-19 incluido', 'Asistencia 24/7'],
          popular: true,
        },
        {
          id: 'premium',
          name: 'Premium',
          price: 65,
          coverage: '$100,000 USD',
          features: ['Todo de Explorer', 'Seguro de actividades', 'Mayores límites', 'Concierge personal', 'Cobertura familiar'],
          popular: false,
        },
      ];

      const handleSelect = (plan) => {
        setSelectedPlan(plan.id);
      };

      const handleContinue = () => {
        if (selectedPlan) {
          onUpdate({ selectedPlan });
          onNext();
        }
      };

      return (
        <div className="space-y-6">
          <div className="text-center mb-8">
            <h2 className="text-2xl font-semibold text-gray-900 mb-2">
              Elige tu plan de protección
            </h2>
            <p className="text-gray-500 text-sm">Compara los planes disponibles</p>
          </div>

          <div className="grid md:grid-cols-3 gap-4">
            {plans.map((plan) => (
              <button
                key={plan.id}
                onClick={() => handleSelect(plan.id)}
                className={`relative p-6 rounded-2xl border-2 transition-all duration-200 text-center flex flex-col ${
                  selectedPlan === plan.id
                    ? 'border-blue-500 bg-blue-500 text-white shadow-xl'
                    : plan.popular
                    ? 'border-blue-500 bg-white shadow-lg scale-105'
                    : 'border-gray-200 bg-white hover:border-blue-500'
                }`}
              >
                {plan.popular && (
                  <span className="absolute -top-3 left-1/2 -translate-x-1/2 px-3 py-1 bg-yellow-400 text-gray-900 text-xs font-bold rounded-full">
                    Popular
                  </span>
                )}

                <h3 className="font-semibold text-lg mb-2">{plan.name}</h3>

                <div className="mb-4">
                  <span className="text-3xl font-bold">${plan.price}</span>
                  <span className="text-sm opacity-70">USD</span>
                </div>

                <p className="text-sm opacity-70 mb-4">Cobertura {plan.coverage}</p>

                <ul className="text-left space-y-2 flex-1">
                  {plan.features.map((feature) => (
                    <li key={feature} className="flex items-center gap-2 text-sm">
                      <svg className={`w-4 h-4 shrink-0 ${selectedPlan === plan.id ? 'text-yellow-400' : 'text-blue-500'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
                      </svg>
                      {feature}
                    </li>
                  ))}
                </ul>
              </button>
            ))}
          </div>

          <button
            onClick={handleContinue}
            disabled={!selectedPlan}
            className="w-full h-14 bg-yellow-400 text-gray-900 font-semibold text-lg rounded-xl hover:bg-yellow-500 disabled:bg-gray-200 disabled:text-gray-400 transition-all duration-200 shadow-lg"
          >
            Continuar
          </button>
        </div>
      );
    }

    // ============================================
    // STEP SUCCESS
    // ============================================
    function StepSuccess({ data }) {
      return (
        <div className="text-center space-y-6 py-8">
          <div className="w-24 h-24 mx-auto bg-green-100 rounded-full flex items-center justify-center">
            <svg className="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
            </svg>
          </div>

          <div>
            <h2 className="text-2xl font-semibold text-gray-900 mb-2">¡Listo!</h2>
            <p className="text-gray-500">Tu asistencia de viaje está activa</p>
          </div>

          <div className="bg-gray-50 rounded-xl p-4">
            <p className="text-sm text-gray-500 mb-1">Resumen</p>
            <p className="text-sm font-medium text-gray-700">
              {data.origin} → {data.destination}
            </p>
            <p className="text-sm text-gray-500">
              {data.travelers} • {data.day}/{data.month}/{data.year}
            </p>
          </div>
        </div>
      );
    }

    // ============================================
    // MAIN WIZARD
    // ============================================
    function TravelInsuranceWizard() {
      const [currentStep, setCurrentStep] = useState(0);
      const [formData, setFormData] = useState({});
      const [direction, setDirection] = useState('left');

      const TOTAL_STEPS = 6;
      const progress = ((currentStep) / (TOTAL_STEPS - 1)) * 100;

      const steps = [
        { id: 'origin', label: 'Origen' },
        { id: 'dates', label: 'Fechas' },
        { id: 'travelers', label: 'Viajeros' },
        { id: 'birthdate', label: 'Nacimiento' },
        { id: 'plans', label: 'Planes' },
        { id: 'success', label: '¡Listo!' },
      ];

      const handleUpdate = (newData) => {
        setFormData((prev) => ({ ...prev, ...newData }));
      };

      const handleNext = () => {
        setDirection('left');
        setCurrentStep((prev) => Math.min(prev + 1, TOTAL_STEPS - 1));
      };

      const handlePrev = () => {
        setDirection('right');
        setCurrentStep((prev) => Math.max(prev - 1, 0));
      };

      const renderStep = () => {
        switch (currentStep) {
          case 0:
            return <StepOrigin data={formData} onUpdate={handleUpdate} onNext={handleNext} />;
          case 1:
            return <StepDates data={formData} onUpdate={handleUpdate} onNext={handleNext} />;
          case 2:
            return <StepTravelers data={formData} onUpdate={handleUpdate} onNext={handleNext} />;
          case 3:
            return <StepBirthdate data={formData} onUpdate={handleUpdate} onNext={handleNext} />;
          case 4:
            return <StepPlans data={formData} onUpdate={handleUpdate} onNext={handleNext} />;
          case 5:
            return <StepSuccess data={formData} />;
          default:
            return null;
        }
      };

      return (
        <div className="min-h-screen bg-gray-50 flex flex-col">
          {/* Header */}
          <header className="bg-white border-b border-gray-100 px-4 py-4">
            <div className="max-w-2xl mx-auto">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-lg bg-gray-900 flex items-center justify-center">
                    <span className="text-white font-bold text-sm">CA</span>
                  </div>
                  <span className="font-semibold text-gray-900">Continental Assist</span>
                </div>
                <span className="text-sm text-gray-400">
                  {currentStep + 1} / {TOTAL_STEPS}
                </span>
              </div>
              <div className="h-1 bg-gray-200 rounded-full overflow-hidden">
                <div
                  className="h-full bg-gray-900 rounded-full transition-all duration-500 ease-out"
                  style={{ width: `${progress}%` }}
                />
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 flex items-center justify-center px-4 py-8">
            <div className="w-full max-w-md">
              <div className="bg-white rounded-2xl shadow-lg p-6 md:p-8 border border-gray-100">
                <Transition direction={direction}>
                  {renderStep()}
                </Transition>
              </div>
            </div>
          </main>

          {/* Footer */}
          {currentStep > 0 && currentStep < TOTAL_STEPS - 1 && (
            <footer className="bg-white border-t border-gray-100 px-4 py-4">
              <div className="max-w-2xl mx-auto flex justify-center">
                <button
                  onClick={handlePrev}
                  className="text-gray-500 hover:text-gray-900 text-sm font-medium flex items-center gap-1 transition-colors"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" />
                  </svg>
                  Atrás
                </button>
              </div>
            </footer>
          )}
        </div>
      );
    }

    // ============================================
    // TRANSITION COMPONENT
    // ============================================
    function Transition({ children, direction }) {
      const [show, setShow] = useState(true);
      const [style, setStyle] = useState({});

      useEffect(() => {
        setShow(false);
        const timer = setTimeout(() => {
          setShow(true);
          setStyle({
            transform: direction === 'left' ? 'translateX(40px)' : 'translateX(-40px)',
            opacity: 0
          });
          requestAnimationFrame(() => {
            setStyle({
              transform: 'translateX(0)',
              opacity: 1,
              transition: 'all 0.35s cubic-bezier(0.4, 0, 0.2, 1)'
            });
          });
        }, 50);
        return () => clearTimeout(timer);
      }, [direction]);

      if (!show) return <div style={{ minHeight: '200px' }} />;

      return (
        <div style={style}>
          {children}
        </div>
      );
    }

    // ============================================
    // MOUNT
    // ============================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TravelInsuranceWizard />);
  </script>
</body>
</html>
